<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Up Pass - Saiem Bd Top Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    body { font-family: Arial, sans-serif; }
    ::-webkit-scrollbar { display: none; }
    .package-card {
        border: 2px solid #374151;
        border-radius: 12px;
        padding: 15px;
        cursor: pointer;
        transition: .3s;
        background: #1f2937;
    }
    .package-card:hover {
        border-color: #3b82f6;
        transform: translateY(-2px);
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
    }
    .package-card input { display: none; }
    .package-card.selected {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.15);
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }
</style>
</head>

<body class="bg-gray-900 text-white pb-24">

<header class="bg-gray-800 shadow-md sticky top-0 z-50 border-b border-gray-700">
    <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
        <a href="../index.html" class="flex items-center gap-3 hover:opacity-90">
            <div class="bg-blue-600 text-white px-3 py-1.5 rounded-lg font-extrabold text-sm shadow-md">Saiem Bd</div>
            <div><h1 class="text-xl font-black text-white tracking-wide">SAIEM BD <span class="text-blue-500">TOPUP</span></h1></div>
        </a>
        <div class="flex items-center gap-3">
            <div class="bg-gray-700 border border-gray-600 text-blue-400 px-4 py-2 rounded-lg font-bold shadow-inner">
                💰 <span id="walletBalance">0</span>৳
            </div>
            <a href="dashboard.html" id="dashboardBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold transition shadow-md">Dashboard</a>
            <a href="login.html" id="loginBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold transition shadow-md">Login</a>
            <button id="logoutBtn" class="hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold transition shadow-md">Logout</button>
        </div>
    </div>
</header>

<div class="max-w-6xl mx-auto mt-6 px-4">
    <div class="relative w-full h-40 md:h-56 rounded-2xl overflow-hidden shadow-2xl border border-gray-700">
        <img src="https://wallpapercave.com/wp/wp5128415.jpg" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent opacity-80"></div>
        <div class="absolute bottom-4 left-4">
            <h2 class="text-2xl font-black text-white">Level Up Pass</h2>
            <p class="text-blue-400 text-sm font-bold">Special Offer</p>
        </div>
    </div>
</div>

<div class="max-w-6xl mx-auto px-4 mt-8">
    <div class="bg-gray-800 rounded-2xl shadow-lg border border-gray-700 p-6 mb-8">
        <h3 class="text-xl font-bold mb-4 border-l-4 border-blue-500 pl-3">Enter Player UID</h3>
        <div class="flex flex-col md:flex-row gap-4">
            <input id="playerUID" type="number" placeholder="Enter Free Fire UID (e.g. 123456789)" class="flex-1 bg-gray-900 border border-gray-600 text-white rounded-lg p-3 outline-none focus:border-blue-500 transition font-bold tracking-wider">
            <button id="checkUidBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold transition shadow-md whitespace-nowrap flex items-center justify-center gap-2"><i class="fa-solid fa-magnifying-glass"></i> Get Name</button>
        </div>
        <div class="mt-4"><div id="playerNameDisplay" class="border border-gray-700 rounded-lg p-3 bg-gray-900 text-gray-400 text-sm flex items-center gap-2"><i class="fa-solid fa-user text-blue-500"></i> Player name will appear here...</div></div>
    </div>

    <h3 class="text-xl font-bold mb-4 border-l-4 border-blue-500 pl-3">Select Level Up Package</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <label class="package-card"><input type="radio" name="package" value="60"><div class="flex justify-between items-center"><div><h4 class="font-bold text-gray-200">Level Up 6</h4><p class="text-blue-400 text-xs mt-0.5">Free Fire</p></div><span class="text-blue-500 font-black text-lg">60৳</span></div></label>
        <label class="package-card"><input type="radio" name="package" value="100"><div class="flex justify-between items-center"><div><h4 class="font-bold text-gray-200">Level Up 10</h4><p class="text-blue-400 text-xs mt-0.5">Free Fire</p></div><span class="text-blue-500 font-black text-lg">100৳</span></div></label>
        <label class="package-card"><input type="radio" name="package" value="200"><div class="flex justify-between items-center"><div><h4 class="font-bold text-gray-200">Level Up 20</h4><p class="text-blue-400 text-xs mt-0.5">Free Fire</p></div><span class="text-blue-500 font-black text-lg">200৳</span></div></label>
    </div>

    <div class="bg-gray-800 rounded-2xl shadow-lg border border-gray-700 p-6 mt-8 mb-10">
        <h3 class="text-xl font-bold mb-5 border-l-4 border-blue-500 pl-3">Payment Method</h3>
        <div class="grid grid-cols-2 gap-4">
            <label class="package-card selected"><input type="radio" name="payment" checked><div class="text-center"><i class="fas fa-wallet text-3xl text-blue-500 mb-2"></i><h4 class="font-bold text-white">Wallet Pay</h4></div></label>
            <label class="package-card opacity-50 cursor-not-allowed"><input type="radio" name="payment" disabled><div class="text-center"><i class="fas fa-bolt text-3xl text-gray-500 mb-2"></i><h4 class="font-bold text-gray-400">Auto Payment (Off)</h4></div></label>
        </div>
        <div class="mt-6 p-4 rounded-xl bg-gray-900 border border-gray-700 flex justify-between items-center">
            <span class="text-gray-400 font-bold">Your Wallet Balance</span><strong class="text-xl text-blue-400">৳ <span id="paymentWalletBalance">0</span></strong>
        </div>
        <button id="buyNowBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl text-lg font-black tracking-widest transition shadow-lg flex justify-center items-center gap-2"><i class="fa-solid fa-cart-shopping"></i> BUY NOW</button>
    </div>
</div>

<nav class="fixed bottom-0 left-0 w-full bg-gray-800 border-t border-gray-700 shadow-lg md:hidden z-50">
    <div class="grid grid-cols-4 text-center py-2">
        <a href="../index.html" class="text-gray-400 hover:text-blue-500 transition"><i class="fa-solid fa-house text-xl mb-1"></i><p class="text-[10px] font-semibold">Home</p></a>
        <a href="tracking.html" class="text-gray-400 hover:text-blue-500 transition"><i class="fa-solid fa-box text-xl mb-1"></i><p class="text-[10px] font-semibold">Orders</p></a>
        <a href="wallet.html" class="text-gray-400 hover:text-blue-500 transition"><i class="fa-solid fa-wallet text-xl mb-1"></i><p class="text-[10px] font-semibold">Wallet</p></a>
        <a href="dashboard.html" class="text-gray-400 hover:text-blue-500 transition"><i class="fa-solid fa-user text-xl mb-1"></i><p class="text-[10px] font-semibold">Account</p></a>
    </div>
</nav>

<script type="module">
import { auth, db } from "../js/firebase.js"; 
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { doc, getDoc, collection, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYa3Udl_PoojcCSe-47hZ-Hji9JBiOvAvavF7CXJ572cR_mUVgptCTQNsaz6i2EcVJ1Q/exec";

async function sendTelegramMessage(message) {
    try {
        await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ message: message })
        });
    } catch (error) {
        console.error("Telegram Error:", error);
    }
}

// ==========================================
// Player UID Checker API
// ==========================================
const checkUidBtn = document.getElementById("checkUidBtn");
const playerNameDisplay = document.getElementById("playerNameDisplay");

if (checkUidBtn) {
    checkUidBtn.addEventListener("click", async () => {
        const uid = document.getElementById("playerUID").value.trim();
        if (uid === "") { alert("অনুগ্রহ করে Player UID দিন!"); return; }

        const originalBtnText = checkUidBtn.innerHTML;
        checkUidBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
        checkUidBtn.disabled = true;
        playerNameDisplay.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-blue-500"></i> সার্ভার থেকে নাম খোঁজা হচ্ছে...';

        try {
            let playerName = null;
            let success = false;

            try {
                const res1 = await fetch(`https://api.isan.eu.org/nickname/ff?id=${uid}`);
                const data1 = await res1.json();
                if (data1.name) { playerName = data1.name; success = true; }
            } catch(e) { console.log("API 1 failed"); }

            if (!success) {
                try {
                    const res2 = await fetch(`https://free-ff-api-src-5plp.onrender.com/api/v1/account?region=BD&uid=${uid}`);
                    const data2 = await res2.json();
                    if (data2.basicInfo && data2.basicInfo.nickname) { playerName = data2.basicInfo.nickname; success = true; }
                } catch(e) { console.log("API 2 failed"); }
            }

            if (success && playerName) {
                playerNameDisplay.innerHTML = `<i class="fa-solid fa-check-circle text-green-500"></i> <span class="text-white font-bold text-base tracking-wider">${playerName}</span>`;
            } else {
                playerNameDisplay.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-500"></i> ভুল UID বা সার্ভার ডাউন! ১ মিনিট পর আবার ক্লিক করুন।`;
            }
        } catch (error) {
            playerNameDisplay.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-yellow-500"></i> সার্ভার সমস্যা! কিছুক্ষণ পর চেষ্টা করুন।`;
        } finally {
            checkUidBtn.innerHTML = originalBtnText;
            checkUidBtn.disabled = false;
        }
    });
}
// ==========================================

const cards = document.querySelectorAll("input[name='package']");
cards.forEach((input) => {
    input.addEventListener("change", () => {
        document.querySelectorAll("input[name='package']").forEach((radio) => {
            radio.closest(".package-card").classList.remove("selected");
        });
        if(input.checked) input.closest(".package-card").classList.add("selected");
    });
});

const dashboardBtn = document.getElementById("dashboardBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginBtn = document.getElementById("loginBtn");

onAuthStateChanged(auth, async (user) => {
    if (user) {
        dashboardBtn.classList.remove("hidden");
        logoutBtn.classList.remove("hidden");
        loginBtn.classList.add("hidden");
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
            const balance = Number(userSnap.data().balance || 0);
            document.getElementById("walletBalance").innerText = balance;
            document.getElementById("paymentWalletBalance").innerText = balance;
        }
    } else {
        dashboardBtn.classList.add("hidden");
        logoutBtn.classList.add("hidden");
        loginBtn.classList.remove("hidden");
    }
});

logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "login.html";
});

const buyNowBtn = document.getElementById("buyNowBtn");
buyNowBtn.addEventListener("click", async () => {
    try {
        const user = auth.currentUser;
        if (!user) { alert("অনুগ্রহ করে আগে লগিন করুন!"); window.location.href = "login.html"; return; }

        const uidInput = document.getElementById("playerUID");
        const uid = uidInput.value.trim();
        if (uid === "") { alert("অনুগ্রহ করে Player UID দিন!"); return; }

        const selectedPackage = document.querySelector('input[name="package"]:checked');
        if (!selectedPackage) { alert("অনুগ্রহ করে একটি প্যাকেজ সিলেক্ট করুন!"); return; }

        const packageCard = selectedPackage.closest(".package-card");
        const packageName = packageCard.querySelector("h4").innerText;
        const orderAmount = Number(selectedPackage.value); 

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) { alert("User Data Not Found"); return; }

        const userData = userSnap.data();
        const walletBalance = Number(userData.balance || 0);

        if (walletBalance < orderAmount) {
            alert("আপনার ওয়ালেটে পর্যাপ্ত টাকা নেই! দয়া করে Add Money করুন।");
            window.location.href = "wallet.html";
            return;
        }

        buyNowBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        buyNowBtn.disabled = true;

        const batch = writeBatch(db);
        const orderRef = doc(collection(db, "orders"));

        batch.update(userRef, { balance: walletBalance - orderAmount });
        batch.set(orderRef, {
            uid: user.uid, email: user.email, playerUID: uid, packageName: packageName,
            amount: orderAmount, paymentMethod: "Wallet", status: "Pending", createdAt: serverTimestamp()
        });

        await batch.commit();

        const msg = `🎮 <b>New Level Up Pass Order!</b>\n\n👤 Email: ${user.email}\n🎮 UID: <code>${uid}</code>\n📦 Package: ${packageName}\n💵 Amount: ৳${orderAmount}`;
        await sendTelegramMessage(msg);

        document.getElementById("walletBalance").innerText = walletBalance - orderAmount;
        document.getElementById("paymentWalletBalance").innerText = walletBalance - orderAmount;

        uidInput.value = "";
        selectedPackage.checked = false;
        selectedPackage.closest(".package-card").classList.remove("selected");
        document.getElementById("playerNameDisplay").innerHTML = '<i class="fa-solid fa-user text-blue-500"></i> Player name will appear here...';

        alert("আপনার অর্ডারটি সফলভাবে রিসিভ হয়েছে!");
        window.location.href = "tracking.html"; 

    } catch (error) {
        console.log(error);
        alert(error.message);
        buyNowBtn.innerHTML = '<i class="fa-solid fa-cart-shopping"></i> BUY NOW';
        buyNowBtn.disabled = false;
    }
});
</script>
</body>
</html>
