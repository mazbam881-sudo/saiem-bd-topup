<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History - Saiem Bd Top Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    ::-webkit-scrollbar { display: none; }
</style>
</head>

<body class="bg-gray-900 text-white pb-24">

<!-- Header (Dark + Blue Theme) -->
<header class="bg-gray-800 shadow-md sticky top-0 z-50 border-b border-gray-700">
    <div class="max-w-md mx-auto flex items-center justify-between p-4">
        <a href="dashboard.html" class="text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-xl font-bold text-white text-center flex-1">
            History
        </h1>
        <div class="w-5"></div>
    </div>
</header>

<div class="max-w-md mx-auto mt-6 px-4 mb-10">
    
    <div class="flex items-center justify-between mb-6 border-l-4 border-blue-500 pl-3">
        <h2 class="text-lg font-bold text-white">Transaction History</h2>
    </div>

    <!-- History List Container -->
    <div id="transactionsList" class="space-y-4">
        <!-- Loading State -->
        <div class="text-center py-10">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500 mb-3"></i>
            <p class="text-gray-400 text-sm">হিস্ট্রি লোড হচ্ছে...</p>
        </div>
    </div>

</div>

<!-- Bottom Mobile Nav -->
<nav class="fixed bottom-0 left-0 w-full bg-gray-800 border-t border-gray-700 shadow-lg z-50">
    <div class="max-w-md mx-auto grid grid-cols-4 text-center py-2">
        <a href="../index.html" class="text-gray-400 hover:text-blue-500 transition">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <p class="text-[10px] font-semibold">Home</p>
        </a>
        <a href="tracking.html" class="text-gray-400 hover:text-blue-500 transition">
            <i class="fa-solid fa-box text-xl mb-1"></i>
            <p class="text-[10px] font-semibold">Orders</p>
        </a>
        <a href="wallet.html" class="text-blue-500 transition">
            <i class="fa-solid fa-wallet text-xl mb-1"></i>
            <p class="text-[10px] font-bold">Wallet</p>
        </a>
        <a href="dashboard.html" class="text-gray-400 hover:text-blue-500 transition">
            <i class="fa-solid fa-user text-xl mb-1"></i>
            <p class="text-[10px] font-semibold">Account</p>
        </a>
    </div>
</nav>

<script type="module">
import { auth, db } from "../js/firebase.js"; 
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const transactionsList = document.getElementById("transactionsList");

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    try {
        // ফায়ারবেস থেকে ইউজারের ব্যালেন্স রিকোয়েস্টগুলো খোঁজা
        const q = query(
            collection(db, "balance_requests"),
            where("uid", "==", user.uid)
        );
        
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
            transactionsList.innerHTML = `
                <div class="bg-gray-800 border border-gray-700 rounded-2xl p-8 text-center shadow-lg">
                    <i class="fa-solid fa-receipt text-4xl text-gray-600 mb-3"></i>
                    <p class="text-gray-400 text-sm">আপনার কোনো ট্রানজেকশন নেই!</p>
                </div>`;
            return;
        }

        // ডাটাগুলোকে সময় অনুযায়ী সাজানো (নতুনগুলো উপরে)
        let docsArray = [];
        querySnapshot.forEach((doc) => {
            docsArray.push(doc.data());
        });

        docsArray.sort((a, b) => {
            const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
            const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
            return timeB - timeA;
        });

        let html = "";
        docsArray.forEach((data) => {
            // তারিখ ও সময় ঠিক করা
            const date = data.createdAt ? data.createdAt.toDate().toLocaleString('bn-BD', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'
            }) : "N/A";
            
            // স্ট্যাটাস অনুযায়ী কালার নির্ধারণ
            let statusColor = "text-yellow-500 bg-yellow-500/10 border-yellow-500/20"; 
            let statusIcon = "fa-clock";
            
            if (data.status === "Approved") {
                statusColor = "text-green-500 bg-green-500/10 border-green-500/20";
                statusIcon = "fa-check-circle";
            } else if (data.status === "Rejected") {
                statusColor = "text-red-500 bg-red-500/10 border-red-500/20";
                statusIcon = "fa-times-circle";
            }

            html += `
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow flex justify-between items-center hover:border-blue-500/50 transition">
                <div>
                    <p class="text-sm font-bold text-gray-200 mb-1">Add Money</p>
                    <p class="text-xs text-gray-400 mb-0.5">TrxID: <span class="text-blue-400">${data.trxId}</span></p>
                    <p class="text-[10px] text-gray-500"><i class="fa-regular fa-calendar-days mr-1"></i>${date}</p>
                </div>
                <div class="text-right flex flex-col items-end">
                    <p class="text-lg font-black text-white mb-1">৳${data.amount}</p>
                    <p class="text-[10px] font-bold ${statusColor} border px-2 py-0.5 rounded-full flex items-center gap-1">
                        <i class="fa-solid ${statusIcon}"></i> ${data.status}
                    </p>
                </div>
            </div>`;
        });

        transactionsList.innerHTML = html;

    } catch (error) {
        console.error("Error loading history:", error);
        transactionsList.innerHTML = `<div class="text-center text-red-500 py-10">হিস্ট্রি লোড করতে সমস্যা হয়েছে!</div>`;
    }
});
</script>

</body>
</html>
