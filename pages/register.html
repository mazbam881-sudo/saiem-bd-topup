<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Saiem Bd Top Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white">

<!-- Header (Dark + Blue Theme) -->
<header class="bg-gray-800 shadow-md sticky top-0 z-50 border-b border-gray-700">
<div class="max-w-6xl mx-auto flex justify-between items-center p-4">
    <!-- Logo -->
    <a href="../index.html" class="flex items-center gap-3 hover:opacity-90">
        <div class="bg-blue-600 text-white px-3 py-1.5 rounded-lg font-extrabold text-sm shadow-md">
            Saiem Bd
        </div>
        <div>
            <h1 class="text-xl font-black text-white tracking-wide">
                SAIEM BD <span class="text-blue-500">TOPUP</span>
            </h1>
        </div>
    </a>

    <div class="flex items-center gap-2">
        <a href="register.html" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold transition shadow-md">
            Register
        </a>
        <a href="login.html" class="px-4 py-2 bg-gray-700 text-gray-300 rounded-lg font-bold hover:bg-gray-600 transition shadow">
            Login
        </a>
    </div>
</div>
</header>

<!-- Register Form -->
<div class="max-w-md mx-auto mt-12 bg-gray-800 rounded-2xl shadow-lg border border-gray-700 p-8 mb-10">

    <h2 class="text-3xl font-black text-center text-white mb-2">Sign Up</h2>
    <p class="text-center text-gray-400 mb-8 text-sm">Enter your information to create an account.</p>

    <label class="font-semibold text-gray-300 text-sm">Full Name</label>
    <input type="text" id="fullname" placeholder="Enter Your Full Name"
        class="w-full mt-2 mb-4 bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-blue-500 transition">

    <label class="font-semibold text-gray-300 text-sm">Mobile Number</label>
    <input type="tel" id="mobile" placeholder="01XXXXXXXXX"
        class="w-full mt-2 mb-4 bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-blue-500 transition">

    <label class="font-semibold text-gray-300 text-sm">Email Address</label>
    <input type="email" id="email" placeholder="Enter Your Email"
        class="w-full mt-2 mb-4 bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:outline-none focus:border-blue-500 transition">

    <label class="font-semibold text-gray-300 text-sm">Password</label>
    <div class="relative">
        <input type="password" id="password" placeholder="Create Password"
            class="w-full mt-2 bg-gray-900 border border-gray-600 text-white rounded-lg p-3 pr-12 focus:outline-none focus:border-blue-500 transition">
        <button type="button" id="togglePassword" class="absolute right-4 top-6 text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-eye"></i>
        </button>
    </div>

    <label class="font-semibold mt-4 block text-gray-300 text-sm">Confirm Password</label>
    <div class="relative">
        <input type="password" id="confirmPassword" placeholder="Confirm Password"
            class="w-full mt-2 bg-gray-900 border border-gray-600 text-white rounded-lg p-3 pr-12 focus:outline-none focus:border-blue-500 transition">
        <button type="button" id="toggleConfirmPassword" class="absolute right-4 top-6 text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-eye"></i>
        </button>
    </div>

    <button id="registerBtn" class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg text-lg font-bold transition shadow-lg">
        CREATE ACCOUNT
    </button>

    <!-- OR -->
    <div class="flex items-center my-6">
        <div class="flex-1 border-t border-gray-600"></div>
        <span class="px-3 text-gray-400 text-xs font-bold uppercase">OR</span>
        <div class="flex-1 border-t border-gray-600"></div>
    </div>

    <!-- Google Sign Up -->
    <button type="button" id="googleRegisterBtn" class="w-full bg-gray-700 border border-gray-600 hover:bg-gray-600 text-white py-3 rounded-lg text-lg font-bold flex items-center justify-center gap-2 transition shadow">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
        Sign up with Google
    </button>

    <p class="text-center mt-6 text-gray-400 text-sm">
        Already have an account?
        <a href="login.html" class="text-blue-500 font-bold hover:underline transition">Sign In</a>
    </p>

</div>

<!-- Footer -->
<div class="text-center mt-10 mb-6 text-gray-500 text-xs">
    © 2026 Saiem Bd Top Up. All Rights Reserved.
</div>

<script type="module">
import { auth, db } from "../js/firebase.js"; 
import { createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const fullName = document.getElementById("fullname");
const mobile = document.getElementById("mobile");
const email = document.getElementById("email");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const registerBtn = document.getElementById("registerBtn");
const googleRegisterBtn = document.getElementById("googleRegisterBtn");

// Password Show/Hide
const togglePassword = document.getElementById("togglePassword");
togglePassword.addEventListener("click", () => {
  if (password.type === "password") {
    password.type = "text";
    togglePassword.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
  } else {
    password.type = "password";
    togglePassword.innerHTML = '<i class="fa-solid fa-eye"></i>';
  }
});

// Confirm Password Show/Hide
const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
toggleConfirmPassword.addEventListener("click", () => {
  if (confirmPassword.type === "password") {
    confirmPassword.type = "text";
    toggleConfirmPassword.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
  } else {
    confirmPassword.type = "password";
    toggleConfirmPassword.innerHTML = '<i class="fa-solid fa-eye"></i>';
  }
});

// Email/Password Register
registerBtn.addEventListener("click", async () => {
  const userFullName = fullName.value.trim();
  const userMobile = mobile.value.trim();
  const userEmail = email.value.trim();
  const userPassword = password.value.trim();
  const confirmPass = confirmPassword.value.trim();

  if (userFullName === "" || userMobile === "" || userEmail === "" || userPassword === "" || confirmPass === "") {
    alert("Please fill all fields.");
    return;
  }
  if (userPassword !== confirmPass) {
    alert("Passwords do not match.");
    return;
  }
  if (userPassword.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  const originalText = registerBtn.innerText;
  registerBtn.innerText = "Creating Account...";

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, userEmail, userPassword);
    const user = userCredential.user;

    await setDoc(doc(db, "users", user.uid), {
      fullname: userFullName,
      mobile: userMobile,
      email: userEmail,
      balance: 0
    });

    alert("Account Created Successfully!");
    window.location.href = "login.html";
  } catch (error) {
    console.log(error);
    alert(error.message);
  } finally {
    registerBtn.innerText = originalText;
  }
});

// Google Sign Up
googleRegisterBtn.addEventListener("click", async () => {
  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {
      await setDoc(userRef, {
        fullname: user.displayName || "Google User",
        mobile: "",
        email: user.email || "",
        balance: 0
      });
    }

    alert("Google Sign Up Successful!");
    window.location.href = "dashboard.html";
  } catch (error) {
    console.log(error);
    alert(error.message);
  }
});
</script>
</body>
</html>
