<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - Saiem Bd Top Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    /* কাস্টম স্ক্রলবার হাইড করার জন্য */
    ::-webkit-scrollbar { display: none; }
</style>
</head>

<body class="bg-gray-900 text-white pb-24">

<!-- Header (Dark + Blue Theme) -->
<header class="bg-gray-800 shadow-sm sticky top-0 z-50 border-b border-gray-700">
<div class="max-w-6xl mx-auto flex justify-between items-center p-4">
    <!-- Logo -->
    <a href="../index.html" class="flex items-center gap-3 hover:opacity-90">
        <div class="bg-blue-600 text-white px-3 py-1.5 rounded-lg font-extrabold text-sm shadow-md">
            Saiem Bd
        </div>
        <div>
            <h1 class="text-xl font-black text-white tracking-wide">
                SAIEM BD <span class="text-blue-500">TOPUP</span>
            </h1>
        </div>
    </a>

    <!-- Logout Icon Button -->
    <button id="logoutBtn" class="text-red-500 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition">
        <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Logout</span>
    </button>
</div>
</header>

<div class="max-w-lg mx-auto mt-6 px-4">

    <!-- Profile Overview Card -->
    <div class="bg-gray-800 rounded-2xl shadow-lg border border-gray-700 p-6 flex items-center gap-5">
        <div class="relative">
            <img id="profileImage" src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff&size=100" class="w-16 h-16 rounded-full object-cover border-2 border-blue-500/30">
        </div>
        <div>
            <h2 id="welcomeName" class="text-xl font-bold text-white">Loading...</h2>
            <p id="userEmail" class="text-sm text-gray-400">Loading...</p>
            <div class="mt-1 inline-block bg-blue-500/20 text-blue-400 text-xs px-2 py-0.5 rounded-full font-semibold border border-blue-500/30">
                Verified Member
            </div>
        </div>
    </div>

    <!-- Wallet Card (Blue Gradient) -->
    <div class="mt-6 rounded-2xl bg-gradient-to-r from-blue-600 to-blue-800 text-white p-6 shadow-lg relative overflow-hidden">
        <i class="fa-solid fa-wallet absolute -right-4 -bottom-4 text-7xl opacity-20"></i>
        
        <p class="text-sm font-medium opacity-90 mb-1">Total Balance</p>
        <h2 id="userBalance" class="text-4xl font-bold mb-4">৳0</h2>
        
        <div class="flex gap-3 relative z-10">
            <a href="wallet.html" class="flex-1 bg-white text-blue-700 text-center py-2.5 rounded-xl font-bold shadow hover:bg-gray-100 transition">
                <i class="fa-solid fa-plus-circle mr-1"></i> Add Money
            </a>
            <a href="transactions.html" class="flex-1 bg-blue-700 border border-blue-400 text-white text-center py-2.5 rounded-xl font-bold hover:bg-blue-600 transition shadow">
                <i class="fa-solid fa-clock-rotate-left mr-1"></i> History
            </a>
        </div>
    </div>

    <!-- Quick Menu Grid -->
    <h3 class="text-lg font-bold text-gray-300 mt-8 mb-3 px-1 border-l-4 border-blue-500 pl-3">My Account</h3>
    <div class="grid grid-cols-2 gap-4">
        
        <a href="tracking.html" class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-4 flex flex-col items-center justify-center gap-2 hover:border-blue-500 transition group">
            <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition">
                <i class="fa-solid fa-box-open text-xl"></i>
            </div>
            <span class="font-semibold text-gray-300 group-hover:text-white transition">My Orders</span>
        </a>

        <a href="../index.html" class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-4 flex flex-col items-center justify-center gap-2 hover:border-blue-500 transition group">
            <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition">
                <i class="fa-solid fa-gamepad text-xl"></i>
            </div>
            <span class="font-semibold text-gray-300 group-hover:text-white transition">Top Up Now</span>
        </a>

        <a href="support.html" class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-4 flex flex-col items-center justify-center gap-2 hover:border-blue-500 transition group">
            <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition">
                <i class="fa-solid fa-headset text-xl"></i>
            </div>
            <span class="font-semibold text-gray-300 group-hover:text-white transition">Support</span>
        </a>

        <!-- Profile Edit Trigger -->
        <details class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 group cursor-pointer">
            <summary class="p-4 flex flex-col items-center justify-center gap-2 list-none hover:border-blue-500 transition">
                <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition">
                    <i class="fa-solid fa-user-pen text-xl"></i>
                </div>
                <span class="font-semibold text-gray-300 group-hover:text-white transition">Edit Profile</span>
            </summary>
            
            <div class="p-4 border-t border-gray-700 bg-gray-900 rounded-b-xl cursor-default">
                <label class="text-xs font-semibold text-gray-400">Full Name</label>
                <input type="text" id="editName" class="w-full mt-1 mb-3 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500 text-sm">
                
                <label class="text-xs font-semibold text-gray-400">Mobile Number</label>
                <input type="text" id="editMobile" class="w-full mt-1 mb-4 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500 text-sm">
                
                <button id="saveProfileBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold text-sm transition shadow-md">
                    Save Changes
                </button>
            </div>
        </details>

    </div>

</div>

<!-- Firebase Script -->
<script type="module">
import { auth, db } from "../js/firebase.js"; 
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const userEmail = document.getElementById("userEmail");
const userBalance = document.getElementById("userBalance");
const welcomeName = document.getElementById("welcomeName");
const logoutBtn = document.getElementById("logoutBtn");
const editName = document.getElementById("editName");
const editMobile = document.getElementById("editMobile");
const saveProfileBtn = document.getElementById("saveProfileBtn");

// Load User
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html"; 
        return;
    }
    try {
        if (userEmail) userEmail.textContent = user.email;

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
            const data = userSnap.data();
            if (userBalance) userBalance.textContent = "৳" + (data.balance || 0);
            if (editName) editName.value = data.fullname || "";
            if (editMobile) editMobile.value = data.mobile || "";
            if (welcomeName) welcomeName.textContent = data.fullname || "User";
        }
    } catch (error) {
        console.error(error);
    }
});

// Logout
if (logoutBtn) {
    logoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "login.html"; 
    });
}

// Save Profile
if (saveProfileBtn) {
    saveProfileBtn.addEventListener("click", async () => {
        const user = auth.currentUser;
        if (!user) return;

        const newName = editName.value.trim();
        const newMobile = editMobile.value.trim();

        if (newName === "" || newMobile === "") {
            alert("Please fill all fields.");
            return;
        }

        const originalText = saveProfileBtn.innerText;
        saveProfileBtn.innerText = "Saving...";

        try {
            await updateDoc(doc(db, "users", user.uid), {
                fullname: newName,
                mobile: newMobile
            });

            if (welcomeName) welcomeName.textContent = newName;
            alert("Profile Updated Successfully!");
            document.querySelector("details").removeAttribute("open");

        } catch (error) {
            console.error(error);
            alert("Update Failed");
        } finally {
            saveProfileBtn.innerText = originalText;
        }
    });
}
</script>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full bg-gray-800 border-t border-gray-700 shadow-lg md:hidden z-50">
<div class="max-w-md mx-auto grid grid-cols-4 text-center py-2">
    <a href="../index.html" class="text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-house text-xl mb-1"></i>
        <p class="text-[10px] font-semibold">Home</p>
    </a>
    <a href="tracking.html" class="text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-box text-xl mb-1"></i>
        <p class="text-[10px] font-semibold">Orders</p>
    </a>
    <a href="wallet.html" class="text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-wallet text-xl mb-1"></i>
        <p class="text-[10px] font-semibold">Wallet</p>
    </a>
    <a href="dashboard.html" class="text-blue-500 transition">
        <i class="fa-solid fa-user text-xl mb-1"></i>
        <p class="text-[10px] font-bold">Account</p>
    </a>
</div>
</nav>

</body>
</html>
